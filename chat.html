<style>
/* ─── Design Tokens ──────────────────────────── */
:root {
  --bg:           #F5F3EE;
  --surface:      #FFFFFF;
  --surface-2:    #EFECE6;
  --fg:           #1A1814;
  --fg-muted:     #7A7570;
  --accent:       #0B7B6F;
  --accent-hover: #09685E;
  --accent-light: #E5F4F1;
  --border:       #E3DDD5;
  --own-bg:       #0B7B6F;
  --own-fg:       #FFFFFF;
  --other-bg:     #FFFFFF;
  --other-fg:     #1A1814;
  --shadow:       0 1px 3px rgba(0,0,0,.07), 0 6px 20px rgba(0,0,0,.05);
  --r:            16px;
  --r-sm:         10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:           #111009;
    --surface:      #1C1B16;
    --surface-2:    #26241D;
    --fg:           #F0EDE7;
    --fg-muted:     #7A7570;
    --accent:       #14A892;
    --accent-hover: #11967F;
    --accent-light: #162825;
    --border:       #2E2B23;
    --own-bg:       #14A892;
    --own-fg:       #FFFFFF;
    --other-bg:     #26241D;
    --other-fg:     #F0EDE7;
    --shadow:       0 1px 3px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.2);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:           #111009;
  --surface:      #1C1B16;
  --surface-2:    #26241D;
  --fg:           #F0EDE7;
  --fg-muted:     #7A7570;
  --accent:       #14A892;
  --accent-hover: #11967F;
  --accent-light: #162825;
  --border:       #2E2B23;
  --own-bg:       #14A892;
  --own-fg:       #FFFFFF;
  --other-bg:     #26241D;
  --other-fg:     #F0EDE7;
  --shadow:       0 1px 3px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.2);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
}

/* ─── Setup Modal ──────────────────────────────── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  z-index: 50; padding: 20px;
}
.overlay[hidden] { display: none !important; }

.modal {
  background: var(--surface);
  border-radius: var(--r);
  padding: 32px 28px;
  width: 100%; max-width: 400px;
  box-shadow: var(--shadow);
  animation: modalIn .25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to   { opacity: 1; transform: none; }
}

.modal-logo {
  width: 48px; height: 48px;
  background: var(--accent-light);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; margin-bottom: 16px;
}
.modal h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
.modal .subtitle { color: var(--fg-muted); font-size: .875rem; margin-bottom: 24px; }

.form-label {
  display: block; font-weight: 600; font-size: .8rem;
  letter-spacing: .03em; margin-bottom: 6px; color: var(--fg-muted);
  text-transform: uppercase;
}
.form-input {
  width: 100%; padding: 11px 14px;
  background: var(--surface-2); color: var(--fg);
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: .95rem; font-family: inherit; outline: none;
  transition: border-color .15s;
  margin-bottom: 20px;
}
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--fg-muted); }

.color-grid {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px;
}
.color-dot {
  width: 34px; height: 34px; border-radius: 50%;
  cursor: pointer; border: 3px solid transparent;
  transition: transform .15s, border-color .15s;
}
.color-dot:hover { transform: scale(1.1); }
.color-dot.selected { border-color: var(--fg); transform: scale(1.1); }

.btn-primary {
  width: 100%; padding: 13px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--r-sm);
  font-size: .95rem; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: background .15s;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { opacity: .5; cursor: default; }

/* ─── Greeting Toast ───────────────────────────── */
.greeting {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 30px; padding: 9px 20px;
  font-size: .85rem; font-weight: 600;
  box-shadow: var(--shadow); z-index: 40;
  white-space: nowrap;
  animation: toastIn .3s ease, toastOut .4s 2.8s forwards;
}
.greeting[hidden] { display: none !important; }
@keyframes toastIn  { from { opacity:0; transform: translateX(-50%) translateY(-10px); } to { opacity:1; transform: translateX(-50%); } }
@keyframes toastOut { to   { opacity:0; transform: translateX(-50%) translateY(-10px); } }

/* ─── App Layout ───────────────────────────────── */
.app-wrapper {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  max-width: 720px; width: 100%; margin: 0 auto;
  padding: 12px;
}
.app-wrapper[hidden] { display: none !important; }

/* ─── Chat Panel ────────────────────────────────── */
.chat-panel {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow);
}

/* Header */
.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-icon {
  width: 38px; height: 38px; border-radius: 11px;
  background: var(--accent-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; flex-shrink: 0;
}
.chat-title { font-weight: 700; font-size: .95rem; }
.chat-desc  { font-size: .78rem; color: var(--fg-muted); }

.header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.online-pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--accent-light); color: var(--accent);
  padding: 4px 10px; border-radius: 20px;
  font-size: .75rem; font-weight: 700;
}
.online-pulse {
  width: 6px; height: 6px; border-radius: 50%; background: #22C55E;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.user-chip {
  display: flex; align-items: center; gap: 6px;
  font-size: .8rem; font-weight: 600; color: var(--fg-muted);
  cursor: pointer; padding: 4px 8px; border-radius: 20px;
  transition: background .15s;
}
.user-chip:hover { background: var(--surface-2); }
.mini-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .65rem; font-weight: 700; color: #fff; flex-shrink: 0;
}

/* Messages */
.messages {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 20px 20px 8px;
  display: flex; flex-direction: column;
  gap: 0;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }

/* Date divider */
.date-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 12px 0 8px;
}
.date-divider::before, .date-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.date-divider span {
  font-size: .72rem; color: var(--fg-muted);
  font-weight: 600; white-space: nowrap;
}

/* Message row */
.msg-row {
  display: flex; gap: 8px; align-items: flex-end;
  margin-bottom: 4px;
}
.msg-row.own { flex-direction: row-reverse; }
.msg-row.own .msg-avatar { display: none; }

.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .72rem; font-weight: 700; color: #fff;
  flex-shrink: 0; margin-bottom: 2px;
  user-select: none;
}

.msg-stack { display: flex; flex-direction: column; gap: 2px; max-width: 72%; min-width: 0; }
.msg-row.own .msg-stack { align-items: flex-end; }

.msg-meta {
  display: flex; align-items: baseline; gap: 6px;
  padding: 0 4px;
  font-size: .72rem; color: var(--fg-muted);
}
.msg-name { font-weight: 700; color: var(--fg); }

.bubble {
  padding: 9px 14px;
  border-radius: 18px 18px 18px 4px;
  background: var(--other-bg); color: var(--other-fg);
  font-size: .9rem; line-height: 1.5;
  word-break: break-word; word-wrap: break-word;
  white-space: pre-wrap;
}
.msg-row.own .bubble {
  background: var(--own-bg); color: var(--own-fg);
  border-radius: 18px 18px 4px 18px;
}

.msg-time-own {
  font-size: .7rem; color: var(--fg-muted);
  padding: 0 4px; margin-top: 1px;
}

/* Reactions */
.reactions {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 4px 4px 0;
}
.reaction-pill {
  display: flex; align-items: center; gap: 3px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 20px; padding: 2px 8px;
  font-size: .78rem; cursor: pointer;
  transition: background .1s, border-color .1s;
  user-select: none;
}
.reaction-pill:hover  { background: var(--accent-light); }
.reaction-pill.mine   { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.reaction-count { font-weight: 600; }

/* React button on hover */
.bubble-wrap { position: relative; }
.react-trigger {
  position: absolute; top: 50%; transform: translateY(-50%);
  right: -32px;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 20px; padding: 2px 6px; font-size: .85rem;
  cursor: pointer; opacity: 0; transition: opacity .15s;
  white-space: nowrap;
}
.msg-row.own .react-trigger { right: auto; left: -32px; }
.bubble-wrap:hover .react-trigger { opacity: 1; }

/* Reaction emoji picker popup */
.reaction-picker {
  position: absolute; z-index: 20;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 28px; padding: 6px 10px;
  display: flex; gap: 2px;
  box-shadow: var(--shadow);
  bottom: calc(100% + 6px); left: 0;
  animation: pickIn .15s ease;
}
.reaction-picker.for-own { left: auto; right: 0; }
@keyframes pickIn { from { opacity:0; transform: scale(.85); } to { opacity:1; transform:none; } }
.reaction-picker[hidden] { display: none !important; }
.rp-btn {
  background: none; border: none; cursor: pointer;
  font-size: 1.2rem; padding: 3px 5px; border-radius: 6px;
  transition: transform .1s;
}
.rp-btn:hover { transform: scale(1.3); }

/* Typing indicator */
.typing-row {
  height: 28px; display: flex; align-items: center;
  gap: 8px; padding: 0 20px;
  font-size: .75rem; color: var(--fg-muted);
  flex-shrink: 0;
}
.typing-row[hidden] { display: none !important; }
.typing-dots { display: flex; gap: 3px; }
.typing-dots span {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--fg-muted);
  animation: blink 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: .2s; }
.typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }

/* Scroll to bottom FAB */
.scroll-fab {
  position: absolute; bottom: 76px; right: 20px;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent); color: #fff;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
  font-size: .9rem; transition: transform .15s;
  z-index: 10;
}
.scroll-fab:hover { transform: scale(1.08); }
.scroll-fab[hidden] { display: none !important; }

/* Input area */
.input-area {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; gap: 8px; align-items: flex-end;
  flex-shrink: 0;
}
.input-box {
  flex: 1; min-width: 0;
  background: var(--surface-2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 9px 12px;
  display: flex; align-items: flex-end; gap: 4px;
  transition: border-color .15s;
}
.input-box:focus-within { border-color: var(--accent); }
.msg-textarea {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  color: var(--fg); font-family: inherit; font-size: .9rem;
  resize: none; line-height: 1.5;
  min-height: 22px; max-height: 120px;
  overflow-y: auto;
}
.msg-textarea::placeholder { color: var(--fg-muted); }
.emoji-toggle {
  background: none; border: none; cursor: pointer;
  font-size: 1.1rem; padding: 0 2px; color: var(--fg-muted);
  line-height: 1; flex-shrink: 0;
  transition: transform .15s;
}
.emoji-toggle:hover { transform: scale(1.15); }

.send-btn {
  width: 42px; height: 42px; flex-shrink: 0;
  background: var(--accent); color: #fff;
  border: none; border-radius: 12px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s;
}
.send-btn:hover  { background: var(--accent-hover); }
.send-btn:active { transform: scale(.93); }
.send-btn:disabled { opacity: .45; cursor: default; }

/* Emoji quick picker */
.emoji-quick {
  position: absolute; bottom: calc(100% + 8px); right: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 8px;
  display: flex; flex-wrap: wrap; gap: 2px;
  box-shadow: var(--shadow); z-index: 15;
  max-width: 220px;
}
.emoji-quick[hidden] { display: none !important; }
.eq-btn {
  background: none; border: none; cursor: pointer;
  font-size: 1.2rem; padding: 4px; border-radius: 6px;
  transition: background .1s;
}
.eq-btn:hover { background: var(--surface-2); }

/* Error state */
.error-view {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 32px;
  color: var(--fg-muted);
}
.error-view[hidden] { display: none !important; }
.error-view h2 { font-size: 1.1rem; color: var(--fg); margin-top: 8px; }

/* Empty state */
.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--fg-muted); font-size: .9rem;
}
.empty-emoji { font-size: 2rem; margin-bottom: 10px; }

/* Mobile */
@media (max-width: 640px) {
  .app-wrapper { padding: 0; }
  .chat-panel { border-radius: 0; border-left: none; border-right: none; }
  .msg-stack { max-width: 85%; }
  .chat-desc { display: none; }
}

</head>
<body>

<!-- ─── Setup Overlay ─── -->
<div class="overlay" id="setup-overlay">
  <div class="modal">
    <div class="modal-logo">🏪</div>
    <h2>Tham gia Chat Cộng Đồng</h2>
    <p class="subtitle">Không cần đăng ký — chỉ cần chọn tên hiển thị là xong!</p>

    <label class="form-label" for="nickname-input">Tên của bạn</label>
    <input class="form-input" id="nickname-input" type="text"
           placeholder="Ví dụ: Minh, Anh Hùng, shop_khanh..." maxlength="30" autocomplete="off">

    <label class="form-label">Màu đại diện</label>
    <div class="color-grid" id="color-grid"></div>

    <button class="btn-primary" id="join-btn" disabled>Vào phòng chat →</button>
  </div>
</div>

<!-- ─── Return Greeting ─── -->
<div class="greeting" id="greeting" hidden></div>

<!-- ─── Main App ─── -->
<div class="app-wrapper" id="app" hidden>
  <div style="position:relative; display:flex; flex-direction:column; flex:1; min-height:0;">
    <div class="chat-panel">

      <!-- Header -->
      <div class="chat-header">
        <a href="index.html" title="Về trang chủ" style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--fg);text-decoration:none;font-size:1rem;flex-shrink:0;transition:background .15s" onmouseover="this.style.background='var(--border)'" onmouseout="this.style.background='var(--surface-2)'">←</a>
        <div class="chat-icon">🏪</div>
        <div>
          <div class="chat-title">Phòng Chat Chung</div>
          <div class="chat-desc">hyperMarket Community</div>
        </div>
        <div class="header-right">
          <div class="online-pill">
            <div class="online-pulse"></div>
            <span id="online-count">...</span> online
          </div>
          <div class="user-chip" id="user-chip" title="Nhấn để đổi tên">
            <div class="mini-avatar" id="mini-avatar"></div>
            <span id="mini-name"></span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <div class="empty-emoji">💬</div>
          <div>Chưa có tin nhắn nào.<br>Hãy là người đầu tiên nói chào nhé!</div>
        </div>
      </div>

      <!-- Typing -->
      <div class="typing-row" id="typing-row" hidden>
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="typing-text"></span>
      </div>

      <!-- Input -->
      <div class="input-area">
        <div style="position:relative; flex:1; min-width:0;">
          <div class="input-box">
            <textarea class="msg-textarea" id="msg-input"
                      placeholder="Nhắn tin..." rows="1"></textarea>
            <button class="emoji-toggle" id="emoji-toggle" title="Chèn emoji">😊</button>
          </div>
          <div class="emoji-quick" id="emoji-quick" hidden></div>
        </div>
        <button class="send-btn" id="send-btn" disabled title="Gửi (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- Scroll FAB -->
    <button class="scroll-fab" id="scroll-fab" hidden title="Cuộn xuống">↓</button>
  </div>
</div>

<!-- Error view (Firebase not configured) -->
<div class="error-view" id="error-view" hidden>
  <div style="font-size:2.5rem">⚠️</div>
  <h2>Chưa cấu hình Firebase</h2>
  <p>Điền Firebase config vào biến <code>FIREBASE_CONFIG</code> ở đầu file</p>
</div>

<script>
// ─── Constants ──────────────────────────────────────────────────────
const COLORS = ['#E53E3E','#DD6B20','#D69E2E','#2F855A','#0B7B6F',
                '#2B6CB0','#6B46C1','#B83280','#744210','#4A5568'];

const EMOJIS = [
  '😀','😂','🥹','😍','🤩','😎','🤔','😮','😭','🥺',
  '👍','👏','🙌','❤️','🔥','✨','🎉','💯','😂','🤣',
  '😊','🙏','💪','👀','🤝','💰','📦','🛒','⭐','🏪'
];

const REACTION_EMOJIS = ['❤️','😂','👍','🎉','🔥'];
const REACTION_NAMES  = { '❤️':'heart','😂':'laugh','👍':'thumbs','🎉':'party','🔥':'fire' };
const REACTION_BY_NAME = Object.fromEntries(Object.entries(REACTION_NAMES).map(([e,n])=>[n,e]));

const MAX_MESSAGES = 150;
const TYPING_TTL   = 3500; // ms

// ─── State ──────────────────────────────────────────────────────────
let user     = null;
let db       = null;
let chatRef  = null;

let selectedColor = COLORS[0];
let activeReactionPicker = null;
let activeEmojiQuick     = null;
let typingTimeout        = null;

// Message DOM cache (id → element)
const msgEls  = new Map();
// Message data cache (id → data)
const msgData = new Map();
// Track last date label
let lastDateLabel = '';

// ─── Identity ───────────────────────────────────────────────────────
function loadUser() {
  try { return JSON.parse(localStorage.getItem('hm_chat_user') || 'null'); }
  catch(e) { return null; }
}
function saveUser(u) {
  try { localStorage.setItem('hm_chat_user', JSON.stringify(u)); } catch(e) {}
}

// ─── UI Helpers ─────────────────────────────────────────────────────
function escHtml(t) {
  return String(t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
}

function formatDateLabel(ts) {
  const d   = new Date(ts);
  const now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if (d.toDateString() === now.toDateString())  return 'Hôm nay';
  if (d.toDateString() === yest.toDateString()) return 'Hôm qua';
  return d.toLocaleDateString('vi-VN',{ weekday:'long', day:'numeric', month:'long' });
}

function initial(name) {
  return (name || '?').charAt(0).toUpperCase();
}

function isNearBottom() {
  const el = document.getElementById('messages');
  return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
}

function scrollToBottom(smooth) {
  const el = document.getElementById('messages');
  el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
}

// ─── Setup UI ───────────────────────────────────────────────────────
function buildSetupUI() {
  const grid = document.getElementById('color-grid');
  COLORS.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'color-dot' + (i === 0 ? ' selected' : '');
    d.style.background = c;
    d.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(x => x.classList.remove('selected'));
      d.classList.add('selected');
      selectedColor = c;
    });
    grid.appendChild(d);
  });

  const input = document.getElementById('nickname-input');
  const btn   = document.getElementById('join-btn');

  input.addEventListener('input', () => {
    btn.disabled = !input.value.trim();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !btn.disabled) { e.preventDefault(); joinChat(); }
  });

  btn.addEventListener('click', joinChat);
  input.focus();
}

function joinChat() {
  const name = document.getElementById('nickname-input').value.trim();
  if (!name) return;

  user = { uuid: crypto.randomUUID(), nickname: name, color: selectedColor };
  saveUser(user);
  document.getElementById('setup-overlay').hidden = true;
  showApp();
}

// ─── Greeting toast ─────────────────────────────────────────────────
function showGreeting(name) {
  const el = document.getElementById('greeting');
  el.textContent = `👋 Chào lại, ${name}!`;
  el.hidden = false;
  setTimeout(() => { el.hidden = true; }, 3200);
}

// ─── App ─────────────────────────────────────────────────────────────
function showApp() {
  document.getElementById('app').hidden = false;

  // User chip
  const avatar = document.getElementById('mini-avatar');
  avatar.textContent = initial(user.nickname);
  avatar.style.background = user.color;
  document.getElementById('mini-name').textContent = user.nickname;

  // Allow re-setting name
  document.getElementById('user-chip').addEventListener('click', () => {
    document.getElementById('setup-overlay').hidden = false;
    document.getElementById('nickname-input').value = user.nickname;
    document.getElementById('nickname-input').focus();
    document.getElementById('join-btn').disabled = false;
    // Pre-select color
    document.querySelectorAll('.color-dot').forEach((d, i) => {
      d.classList.toggle('selected', COLORS[i] === user.color);
    });
  });

  connectFirebase();
  buildEmojiPicker();
  buildInputListeners();
  buildScrollFab();
}

// ─── Firebase ────────────────────────────────────────────────────────
function connectFirebase() {
  if (FIREBASE_CONFIG.apiKey === 'YOUR_API_KEY') {
    document.getElementById('error-view').hidden = false;
    document.getElementById('app').hidden = true;
    return;
  }

  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db      = firebase.database();
  chatRef = db.ref('hm/chat');

  subscribeMessages();
  subscribeTyping();
  trackOnline();
}

// ─── Messages subscription ───────────────────────────────────────────
function subscribeMessages() {
  const msgsRef = chatRef.child('messages').limitToLast(MAX_MESSAGES);

  const onError = (err) => {
    console.error('Firebase error:', err);
    if (err && err.code === 'PERMISSION_DENIED') {
      document.getElementById('app').hidden = true;
      const ev = document.getElementById('error-view');
      ev.querySelector('h2').textContent = '⚠️ Không có quyền truy cập';
      ev.querySelector('p').textContent = 'Database chưa được cấu hình quy tắc bảo mật. Vui lòng liên hệ quản trị viên.';
      ev.hidden = false;
    }
  };

  // child_added fires for existing + new messages in order
  msgsRef.on('child_added', (snap) => {
    const data = snap.val();
    if (!data) return;
    appendMsg(snap.key, data, false);
    maybeScrollDown();
  }, onError);

  msgsRef.on('child_changed', (snap) => {
    const data = snap.val();
    if (!data) return;
    msgData.set(snap.key, data);
    updateMsgReactions(snap.key, data.reactions || {});
  }, onError);

  msgsRef.on('child_removed', (snap) => {
    removeMsgEl(snap.key);
  }, onError);
}

// ─── Render message ──────────────────────────────────────────────────
function appendMsg(id, data, scrollDown) {
  if (msgEls.has(id)) return; // already rendered

  msgData.set(id, data);

  // Date divider
  const dateLabel = formatDateLabel(data.ts);
  if (dateLabel !== lastDateLabel) {
    lastDateLabel = dateLabel;
    const div = document.createElement('div');
    div.className = 'date-divider';
    div.innerHTML = `<span>${escHtml(dateLabel)}</span>`;
    appendToList(div);
  }

  const isOwn = data.uuid === user?.uuid;
  const el = buildMsgEl(id, data, isOwn);
  appendToList(el);
  msgEls.set(id, el);

  // Hide empty state
  document.getElementById('empty-state').hidden = true;

  if (scrollDown) scrollToBottom(true);
}

function appendToList(el) {
  const list = document.getElementById('messages');
  list.appendChild(el);
}

function buildMsgEl(id, data, isOwn) {
  const row = document.createElement('div');
  row.className = 'msg-row' + (isOwn ? ' own' : '');
  row.id = 'msg-' + id;

  const avatarHtml = !isOwn
    ? `<div class="msg-avatar" style="background:${escHtml(data.color)}">${escHtml(initial(data.nickname))}</div>`
    : '';

  const metaHtml = !isOwn
    ? `<div class="msg-meta"><span class="msg-name">${escHtml(data.nickname)}</span><span>${escHtml(formatTime(data.ts))}</span></div>`
    : '';

  const timeOwnHtml = isOwn
    ? `<div class="msg-time-own">${escHtml(formatTime(data.ts))}</div>`
    : '';

  const reactionsHtml = buildReactionsHtml(id, data.reactions || {});

  row.innerHTML = `
    ${avatarHtml}
    <div class="msg-stack">
      ${metaHtml}
      <div class="bubble-wrap" data-msgid="${escHtml(id)}" data-own="${isOwn}">
        <div class="bubble">${escHtml(data.text)}</div>
        <button class="react-trigger" title="Thả cảm xúc">😊</button>
      </div>
      <div class="reactions" id="reactions-${escHtml(id)}">${reactionsHtml}</div>
      ${timeOwnHtml}
    </div>
  `;

  // Reaction trigger
  row.querySelector('.react-trigger').addEventListener('click', (e) => {
    e.stopPropagation();
    openReactionPicker(id, row.querySelector('.bubble-wrap'), isOwn);
  });

  // Reaction pill click (delegated)
  row.querySelector('.reactions')?.addEventListener('click', (e) => {
    const pill = e.target.closest('.reaction-pill');
    if (pill) toggleReaction(id, pill.dataset.emoji);
  });

  return row;
}

function buildReactionsHtml(msgId, reactions) {
  // Group: emoji → array of uuids
  const groups = {};
  for (const [key, val] of Object.entries(reactions)) {
    if (!val) continue;
    const [emojiName, uuid] = key.split('__');
    const emoji = REACTION_BY_NAME[emojiName] || emojiName;
    if (!groups[emoji]) groups[emoji] = [];
    groups[emoji].push(uuid);
  }

  return Object.entries(groups).map(([emoji, uuids]) => {
    const mine = user && uuids.includes(user.uuid);
    return `<div class="reaction-pill ${mine ? 'mine' : ''}" data-emoji="${escHtml(emoji)}">
      <span>${emoji}</span>
      <span class="reaction-count">${uuids.length}</span>
    </div>`;
  }).join('');
}

function updateMsgReactions(msgId, reactions) {
  const container = document.getElementById('reactions-' + msgId);
  if (container) container.innerHTML = buildReactionsHtml(msgId, reactions);
  // Re-attach click listener
  container?.addEventListener('click', (e) => {
    const pill = e.target.closest('.reaction-pill');
    if (pill) toggleReaction(msgId, pill.dataset.emoji);
  });
}

function removeMsgEl(id) {
  const el = msgEls.get(id);
  if (el) { el.remove(); msgEls.delete(id); }
  msgData.delete(id);
}

// ─── Reaction picker ─────────────────────────────────────────────────
function openReactionPicker(msgId, bubbleWrap, isOwn) {
  closeReactionPicker();

  const picker = document.createElement('div');
  picker.className = 'reaction-picker' + (isOwn ? ' for-own' : '');

  REACTION_EMOJIS.forEach(emoji => {
    const btn = document.createElement('button');
    btn.className = 'rp-btn';
    btn.textContent = emoji;
    btn.title = emoji;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleReaction(msgId, emoji);
      closeReactionPicker();
    });
    picker.appendChild(btn);
  });

  bubbleWrap.appendChild(picker);
  activeReactionPicker = picker;

  setTimeout(() => {
    document.addEventListener('click', closeReactionPicker, { once: true });
  }, 10);
}

function closeReactionPicker() {
  activeReactionPicker?.remove();
  activeReactionPicker = null;
}

// ─── Toggle reaction ─────────────────────────────────────────────────
function toggleReaction(msgId, emoji) {
  if (!user || !chatRef) return;
  const emojiName = REACTION_NAMES[emoji] || emoji;
  const key = emojiName + '__' + user.uuid;
  const data = msgData.get(msgId);
  const hasReacted = data?.reactions?.[key];
  const reactionRef = chatRef.child('messages').child(msgId).child('reactions').child(key);
  if (hasReacted) reactionRef.remove();
  else            reactionRef.set(true);
}

// ─── Send message ────────────────────────────────────────────────────
async function sendMessage() {
  const textarea = document.getElementById('msg-input');
  const text = textarea.value.trim();
  if (!text || !chatRef || !user) return;

  // ── Gửi bình thường ──────────────────────────────────────────
  textarea.value = '';
  autoResizeTextarea(textarea);
  document.getElementById('send-btn').disabled = true;

  clearTimeout(typingTimeout);
  chatRef.child('typing').child(user.uuid).remove().catch(() => {});

  try {
    await chatRef.child('messages').push({
      uuid:     user.uuid,
      nickname: user.nickname,
      color:    user.color,
      text,
      ts:       firebase.database.ServerValue.TIMESTAMP,
    });
    scrollToBottom(true);
  } catch(err) {
    console.error('Failed to send:', err);
    textarea.value = text;
  } finally {
    document.getElementById('send-btn').disabled = !textarea.value.trim();
  }
}

// ─── Typing indicator ─────────────────────────────────────────────────
function subscribeTyping() {
  chatRef.child('typing').on('value', (snap) => {
    const data = snap.val() || {};
    const others = Object.entries(data)
      .filter(([uuid, d]) => uuid !== user?.uuid && d && (Date.now() - d.ts < TYPING_TTL))
      .map(([, d]) => d.nickname);

    const row = document.getElementById('typing-row');
    if (others.length === 0) {
      row.hidden = true;
    } else {
      row.hidden = false;
      const text = others.length === 1
        ? `${others[0]} đang nhập...`
        : `${others.slice(0,-1).join(', ')} và ${others[others.length-1]} đang nhập...`;
      document.getElementById('typing-text').textContent = text;
    }
  });
}

function updateTypingStatus() {
  if (!chatRef || !user) return;
  chatRef.child('typing').child(user.uuid).set({ nickname: user.nickname, ts: Date.now() }).catch(() => {});
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    chatRef.child('typing').child(user.uuid).remove().catch(() => {});
  }, TYPING_TTL);
}

// ─── Online presence ──────────────────────────────────────────────────
function trackOnline() {
  const presenceRef = chatRef.child('online').child(user.uuid);
  presenceRef.set({ nickname: user.nickname, color: user.color, ts: Date.now() });
  presenceRef.onDisconnect().remove();

  // Refresh every 60s so we stay "online"
  setInterval(() => {
    presenceRef.set({ nickname: user.nickname, color: user.color, ts: Date.now() }).catch(() => {});
  }, 60000);

  // Listen to online count
  chatRef.child('online').on('value', (snap) => {
    const count = snap.numChildren();
    document.getElementById('online-count').textContent = count;
  });
}

// ─── Input listeners ──────────────────────────────────────────────────
function buildInputListeners() {
  const textarea = document.getElementById('msg-input');
  const sendBtn  = document.getElementById('send-btn');

  textarea.addEventListener('input', () => {
    autoResizeTextarea(textarea);
    sendBtn.disabled = !textarea.value.trim();
    updateTypingStatus();
  });

  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  sendBtn.addEventListener('click', () => {
    if (!sendBtn.disabled) sendMessage();
  });
}

function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ─── Emoji quick picker ────────────────────────────────────────────────
function buildEmojiPicker() {
  const toggle  = document.getElementById('emoji-toggle');
  const picker  = document.getElementById('emoji-quick');
  const textarea = document.getElementById('msg-input');

  EMOJIS.forEach(emoji => {
    const btn = document.createElement('button');
    btn.className = 'eq-btn'; btn.textContent = emoji;
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const pos = textarea.selectionStart;
      const val = textarea.value;
      textarea.value = val.slice(0, pos) + emoji + val.slice(pos);
      textarea.selectionStart = textarea.selectionEnd = pos + emoji.length;
      textarea.focus();
      autoResizeTextarea(textarea);
      document.getElementById('send-btn').disabled = !textarea.value.trim();
    });
    picker.appendChild(btn);
  });

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    picker.hidden = !picker.hidden;
  });

  document.addEventListener('click', () => { picker.hidden = true; });
  picker.addEventListener('click', (e) => e.stopPropagation());
}

// ─── Scroll FAB ───────────────────────────────────────────────────────
function buildScrollFab() {
  const fab  = document.getElementById('scroll-fab');
  const msgs = document.getElementById('messages');

  msgs.addEventListener('scroll', () => {
    fab.hidden = isNearBottom();
  });
  fab.addEventListener('click', () => scrollToBottom(true));
}

function maybeScrollDown() {
  if (isNearBottom()) scrollToBottom(false);
  else document.getElementById('scroll-fab').hidden = false;
}

// ─── Bootstrap ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildSetupUI();
  user = loadUser();

  if (user) {
    document.getElementById('setup-overlay').hidden = true;
    showGreeting(user.nickname);
    showApp();
  }
});
</script>
</body>
</html>
